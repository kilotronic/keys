name: red-on-logic

# A pilot of kilotronic/checks/red-on-logic: a pull request's new or changed tests must fail on the base
# branch's code with a wrong answer, not an import error. It is not part of `ci`, so it is not
# required; the owner decides that after the pilot. Labels re-run it: a label
# `red-on-logic: not applicable (<reason>)`, or the same line as a commit trailer, skips it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A new push or label supersedes the last run's answer.
concurrency:
  group: red-on-logic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  red-on-logic:
    # Update bots' pull requests change no tests and cannot add a skip trailer.
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base commit and the pull request's commit messages
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: uv sync --frozen
      - uses: kilotronic/checks/red-on-logic@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0
        with:
          # keys' own words for a name the old code does not know: an option, a command or
          # a provider the branch adds. Failing on them is red on import, not a wrong answer.
          import-patterns: |
            unrecognized arguments
            invalid choice
            unknown service
            ^SystemExit: 2$
