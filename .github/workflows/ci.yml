name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/data-leak-check@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/checks/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/secret-scan@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1

  # Shell scripts, workflows, and actions and base images pinned by commit and digest, from kilotronic/checks/lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/lint@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1

  # Real authors on this event's commits, in the owner's domains, from kilotronic/checks/git-identity.
  git-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # allow-bots on a push asks which pull request a commit merged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/git-identity@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1
        with:
          domains: ixid.net, kilotronic.com
          commit-subject: true

  # pyright (strict) and the tests, the canary tests among them (ruff runs in the prek job). zsh is
  # installed so the canary's shell-history check runs through a real interactive shell, as on the owner's Mac.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: uv sync --frozen
      - run: uv run pyright
      - run: uv run pytest

  # The format and lint bundle from .pre-commit-config.yaml (formatters, ruff, markdownlint, yamllint, ...),
  # the same hooks a commit runs. The identity, secret and private-term hooks run as their own jobs.
  prek:
    name: Format and lint (prek)
    runs-on: ubuntu-latest
    env:
      SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [data-leak-check, secret-scan, lint, git-identity, test, prek]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
